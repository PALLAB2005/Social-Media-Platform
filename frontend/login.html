
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LinkUp</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Animated Background -->
  <div class="particles" id="particles"></div>

  <!-- Navigation -->
  <nav>
    <div class="brand-logo">
      <i class="fas fa-link"></i>
      <a href="index.html" style="text-decoration: none; color: inherit;">
        <span>LinkUp</span>
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">
        <i class="fas fa-home"></i> Home
      </a>
      <a href="register.html" class="nav-link">
        <i class="fas fa-user-plus"></i> Register
      </a>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="container">
    <div style="max-width: 400px; margin: 0 auto;">
      <div class="text-center mb-2">
        <h1><i class="fas fa-sign-in-alt"></i> Welcome Back</h1>
        <p>Login to your LinkUp account</p>
      </div>

      <form id="loginForm">
        <div style="margin-bottom: 1.5rem;">
          <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        
        <div style="margin-bottom: 1.5rem;">
          <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn" style="width: 100%;">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div class="text-center mt-2">
        <p>Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a></p>
        <p><a href="index.html" style="color: var(--gray);"><i class="fas fa-arrow-left"></i> Back to Home</a></p>
      </div>
    </div>
  </div>

  <script src="mock-api.js"></script>
  <script src="js/utils.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Initialize particles
    initParticles();

    // Login form submission
    const loginForm = document.getElementById("loginForm");
    if (loginForm) {
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const submitBtn = loginForm.querySelector('button[type="submit"]');
        
        // Show loading state
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
        submitBtn.disabled = true;

        try {
          const data = await api.login({ email, password });
          
          auth.setCurrentUser(data);
          
          ui.showToast('Login successful!', 'success');
          setTimeout(() => {
            window.location.href = "feed.html";
          }, 1000);
          
        } catch (err) {
          console.error(err);
          ui.showToast(err.message || 'Login failed. Check that the backend is running.', 'error');
        } finally {
          // Reset button
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
      });
    }
  });

  function initParticles() {
    const particles = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.width = Math.random() * 30 + 10 + 'px';
      particle.style.height = particle.style.width;
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 20 + 's';
      particle.style.background = `rgba(${Math.random() * 100}, ${Math.random() * 100}, 238, ${Math.random() * 0.2 + 0.1})`;
      particles.appendChild(particle);
    }
  }
</script>
  
</body>
</html>
